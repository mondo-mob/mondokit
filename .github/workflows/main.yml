# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # The gcloud datastore emulator and firebase-tools both require a JDK 21+ on PATH;
      # the ubuntu-latest default JDK is older, so pin it explicitly.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Cloud SDK and Datastore Emulator
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: beta,cloud-datastore-emulator

      - name: Check gcloud CLI
        run: 'gcloud info'

      - name: Install dependencies
        run: | 
          npm ci
          npm install -g firebase-tools

      - name: Build packages
        run: npm run build

      - name: Run tests
        run: npm run test:ci
